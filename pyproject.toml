[project]
name = "detectionx5"
version = "2.0.0.dev0"
description = "Moroccan licence-plate reading platform: grammar automaton, synthetic plates, evaluation harness, CRNN, fusion, conformal sets and a service."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
authors = [{ name = "Mohamed" }]
# The serving path is torch-free: detection and recognition run through ONNX Runtime
# (ADR 0007). Torch, Ultralytics and EasyOCR live in the `ml` group for training,
# export and the EasyOCR baseline.
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "pyyaml>=6.0.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "structlog>=24.4",
  "onnxruntime>=1.19",
  "plotly>=5.22",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.18",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "rq>=1.16",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
plate = "plate_reader.cli:main"

[dependency-groups]
ml = [
  "torch>=2.5",
  "torchvision>=0.20",
  "ultralytics>=8.3",
  "easyocr>=1.7.2",
  "onnx>=1.16",
  "onnxscript>=0.1",
]
gui = ["ttkbootstrap>=1.10.1"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.8",
  "httpx>=0.27",
  "types-pyyaml>=6.0",
  "fakeredis>=2.24",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plate_reader", "services"]

[tool.uv]
default-groups = ["dev", "ml", "gui"]
# Windows (the development machine) and Linux (CI and containers) are the supported
# platforms; restricting the universal lock to them keeps it small and resolvable.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
# Ultralytics asks for opencv-python while EasyOCR asks for the headless build. Both
# install the same `cv2` package and clobber each other, so only headless is kept.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "services/api/migrations/versions/*.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "N", "PTH"]
# RUF001-003 flag Unicode confusables; this project folds confusables on purpose.
# E501 is left to the formatter.
ignore = ["RUF001", "RUF002", "RUF003", "E501", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "PT006", "PT011", "N802", "SIM117"]
"cli.py" = ["E402"]
"gui.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["plate_reader", "services", "config", "api"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "easyocr.*",
  "ultralytics.*",
  "plotly.*",
  "onnxruntime.*",
  "onnx.*",
  "ttkbootstrap.*",
  "fakeredis.*",
  "torchvision.*",
  "rq.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
markers = [
  "slow: long-running tests (training smoke, large synthetic sets)",
  "models: needs the real detector weights and cached OCR models",
  "gpu: needs a CUDA device",
  "integration: needs external services (Redis, PostgreSQL, Docker)",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["plate_reader"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@overload",
  '^\s*\.\.\.$',
]
