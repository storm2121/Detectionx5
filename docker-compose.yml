# DetectionX5 platform. Host ports are chosen to avoid clashes with other projects on the
# same machine: API 8100, PostgreSQL 5433, Redis 6380, Prometheus 9100, Grafana 3100,
# OpenTelemetry collector 4319 (gRPC) and 4320 (HTTP), dashboard 5174.
# `docker compose --profile tracing up` adds Tempo as the trace store (no host port; browse
# traces in Grafana's Tempo data source).
name: detectionx5

x-plate-env: &plate-env
  PLATE_DB_URL: postgresql+psycopg://plates:plates@postgres:5432/plates
  PLATE_REDIS_URL: redis://redis:6379/0
  PLATE_OTEL_ENDPOINT: http://otel-collector:4318

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plates
      POSTGRES_PASSWORD: plates
      POSTGRES_DB: plates
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plates -d plates"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment: *plate-env
    ports: ["8100:8000"]
    volumes: [storage:/app/storage]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: {context: ., dockerfile: Dockerfile.worker}
    environment:
      <<: *plate-env
      PLATE_MIGRATE: "false"
    volumes: [storage:/app/storage]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4319:4317", "4320:4318"]

  prometheus:
    image: prom/prometheus:v3.4.0
    volumes: ["./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9100:9090"]

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - "./docker/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./docs/grafana:/var/lib/grafana/dashboards:ro"
    ports: ["3100:3000"]
    depends_on: [prometheus]

  dashboard:
    build: {context: ., dockerfile: Dockerfile.dashboard}
    ports: ["5174:80"]

  tempo:
    image: grafana/tempo:2.8.1
    profiles: [tracing]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./docker/tempo.yaml:/etc/tempo.yaml:ro"]

volumes:
  pgdata: {}
  storage: {}
