# Spans arrive over OTLP; the spanmetrics connector turns them into request-rate and
# duration metrics that Prometheus scrapes, the debug exporter logs them, and otlp/tempo
# sends them to Tempo when the stack runs with `--profile tracing`. Without that profile the
# Tempo export fails fast and is dropped (no retries, no queue), so nothing piles up.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  batch: {}

connectors:
  spanmetrics: {}

exporters:
  debug: {verbosity: basic}
  prometheus: {endpoint: 0.0.0.0:8889}
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
    retry_on_failure: {enabled: false}
    sending_queue: {enabled: false}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, spanmetrics, otlp/tempo]
    metrics:
      receivers: [spanmetrics]
      exporters: [prometheus]
