# The console's web server: the built Vue app, and /api forwarded to the plate service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ten photos of up to 10 MiB per read, and video uploads for jobs.
    client_max_body_size 512m;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Job progress is a Server-Sent Events stream: pass it through unbuffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/read, /reads/<id>, /evaluation, ...) all load the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
