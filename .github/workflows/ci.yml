name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint and guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install lint tooling only
        run: uv sync --frozen --no-default-groups --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: No mention of the original dataset host or name
        run: uv run python tools/repo_guards.py names --all
      - name: No real data under data/
        run: uv run python tools/repo_guards.py data --all
      - run: uv run plate docs check
      - run: uv run plate data validate --strict

  type:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy plate_reader services

  test:
    name: unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest (coverage gate 85% on plate_reader)
        run: uv run pytest -q --cov=plate_reader --cov-report=term --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  synthetic-eval:
    name: small synthetic evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache EasyOCR models
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-models-v1
      - name: Byte-deterministic generator
        run: |
          uv run plate synth crops --out /tmp/a --n 30 --seed 7
          uv run plate synth crops --out /tmp/b --n 30 --seed 7
          diff -r /tmp/a /tmp/b
      - name: Evaluate the EasyOCR path and the legacy vote (synthetic, small)
        run: uv run plate eval --set synthetic --n 20 --views 5 --k 3 --resamples 200 --device cpu --out /tmp/results --quiet
      - name: Results carry the synthetic label and bootstrap intervals
        run: |
          uv run python -c "import json; d = json.load(open('/tmp/results/eval_synthetic.json', encoding='utf-8')); assert d['label'] == 'synthetic results are not real-world accuracy'; m = d['recognizers']['easyocr']['metrics']['exact_match']; assert m['ci_low'] <= m['value'] <= m['ci_high']; print(m)"

  dashboard:
    name: dashboard (lint, types, build, unit tests, Storybook, browser parity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm storybook:build
      - name: Browser parity (ONNX Runtime Web against results/parity_fixtures.json)
        run: |
          pnpm exec playwright install --with-deps chromium
          DASHBOARD_PORT=4173 pnpm preview &
          for i in $(seq 60); do curl -sf http://localhost:4173/parity > /dev/null && break; sleep 1; done
          DASHBOARD_URL=http://localhost:4173 pnpm exec playwright test e2e/parity.spec.ts

  dashboard-e2e:
    name: dashboard smoke and accessibility against Compose
    runs-on: ubuntu-latest
    needs: [dashboard]
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Start the stack (with the Tempo trace store)
        run: docker compose --profile tracing up --build -d --wait api worker dashboard tempo
      - name: Install Playwright
        working-directory: apps/dashboard
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Smoke, read, review and axe checks (desktop and phone)
        working-directory: apps/dashboard
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report
      - if: always()
        run: docker compose --profile tracing down -v

  docker:
    name: container images and compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Build the torch-free API and worker images and the dashboard
        run: docker compose build api worker dashboard
