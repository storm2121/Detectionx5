name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint and guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install lint tooling only
        run: uv sync --frozen --no-default-groups --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: No mention of the original dataset host or name
        run: uv run python tools/repo_guards.py names --all
      - name: No real data under data/
        run: uv run python tools/repo_guards.py data --all
      - run: uv run plate docs check
      - run: uv run plate data validate --strict

  type:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy plate_reader services

  test:
    name: unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest (coverage gate 85% on plate_reader)
        run: uv run pytest -q --cov=plate_reader --cov-report=term --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  synthetic-eval:
    name: small synthetic evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache EasyOCR models
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-models-v1
      - name: Byte-deterministic generator
        run: |
          uv run plate synth crops --out /tmp/a --n 30 --seed 7
          uv run plate synth crops --out /tmp/b --n 30 --seed 7
          diff -r /tmp/a /tmp/b
      - name: Evaluate the EasyOCR path and the legacy vote (synthetic, small)
        run: uv run plate eval --set synthetic --n 20 --views 5 --k 3 --resamples 200 --device cpu --out /tmp/results --quiet
      - name: Results carry the synthetic label and bootstrap intervals
        run: |
          uv run python -c "import json; d = json.load(open('/tmp/results/eval_synthetic.json', encoding='utf-8')); assert d['label'] == 'synthetic results are not real-world accuracy'; m = d['recognizers']['easyocr']['metrics']['exact_match']; assert m['ci_low'] <= m['value'] <= m['ci_high']; print(m)"

  docker:
    name: container images and compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Build the torch-free API and worker images and the dashboard placeholder
        run: docker compose build api worker dashboard
